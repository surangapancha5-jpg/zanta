name: Supreme Farm APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7 --legacy-peer-deps
          npm install --save-dev @capacitor/cli@7 --legacy-peer-deps

      - name: Build Game
        run: npm run build

      - name: Configure Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.zanta.supremefarm",
            "appName": "Supreme Farm",
            "webDir": "dist"
          }
          EOF

      - name: Create Android Project
        run: npx cap add android

      - name: Sync Game
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Supreme-Farm-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
